<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;background:#000}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:14px/1.5 sans-serif;opacity:.8}
</style>
</head>
<body>
<video id="v" muted autoplay playsinline webkit-playsinline></video>
<div id="msg">正在加载…</div>
<script src="/static/hls.min.js"></script>
<script>
function getSrc(){
  var m = location.search.match(/[?&]src=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : '';
}
var src = getSrc();
var video = document.getElementById('v');
var msg = document.getElementById('msg');
if(!src){ msg.textContent='缺少视频地址'; }
else if(Hls.isSupported()){
  // 与网页端相同策略：预缓冲 30s，减少 2s 分片卡顿
  var hls = new Hls({
    maxBufferLength: 30,
    maxMaxBufferLength: 60,
    liveSyncDurationCount: 3,
    liveMaxLatencyDurationCount: 6,
    lowLatencyMode: false,
    enableWorker: true,
    manifestLoadingTimeOut: 15000,
    manifestLoadingMaxRetry: 5,
    levelLoadingTimeOut: 15000,
    fragLoadingTimeOut: 20000,
    fragLoadingMaxRetry: 6
  });
  hls.loadSource(src);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, function(){
    msg.style.display='none';
    video.play();
  });
  hls.on(Hls.Events.ERROR, function(e, d){
    if(d && d.fatal){
      msg.style.display='flex';
      msg.textContent = d.type === 'networkError' ? '网络中断，重试中…' : '播放出错';
      if(d.type === 'networkError'){ hls.startLoad(); }
      else { try{ hls.recoverMediaError(); }catch(_){} }
    }
  });
} else {
  video.src = src;
  video.play();
}
</script>
</body>
</html>
