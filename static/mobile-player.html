<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;position:fixed;inset:0}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font:14px/1.5 sans-serif;opacity:.85;padding:16px;text-align:center;pointer-events:none;z-index:2}
#msg.hide{display:none}
</style>
</head>
<body>
<video id="v" muted autoplay playsinline webkit-playsinline></video>
<div id="msg" class="hide"></div>
<script>
var msgTimer = null;

function say(t, autoHideMs) {
  var el = document.getElementById('msg');
  if (msgTimer) { clearTimeout(msgTimer); msgTimer = null; }
  if (!t) {
    el.className = 'hide';
    el.textContent = '';
    try {
      if (window.Flutter && window.Flutter.postMessage) {
        window.Flutter.postMessage('status:playing');
      }
    } catch (e) {}
    return;
  }
  el.textContent = t;
  el.className = '';
  try {
    if (window.Flutter && window.Flutter.postMessage) {
      window.Flutter.postMessage('status:' + t);
    }
  } catch (e) {}
  // 提示默认 2s 后消失，避免长期盖在画面上
  var ms = autoHideMs == null ? 2000 : autoHideMs;
  if (ms > 0) {
    msgTimer = setTimeout(function () {
      el.className = 'hide';
      el.textContent = '';
    }, ms);
  }
}

function getSrc() {
  try {
    var m = location.search.match(/[?&]src=([^&]+)/);
    if (m) return decodeURIComponent(m[1]);
  } catch (e) {}
  return window.__HLS_SRC__ || '';
}

function boot() {
  var src = window.__HLS_SRC__ || getSrc();
  if (!src) { say('缺少视频地址', 0); return; }

  var video = document.getElementById('v');

  function loadHlsJs() {
    if (typeof Hls === 'undefined') {
      say('播放组件未加载', 0);
      return;
    }
    if (!Hls.isSupported()) {
      say('当前环境不支持', 0);
      return;
    }
    say('');
    var hls = new Hls({
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      liveSyncDurationCount: 3,
      liveMaxLatencyDurationCount: 8,
      lowLatencyMode: false,
      enableWorker: true,
      manifestLoadingTimeOut: 20000,
      manifestLoadingMaxRetry: 6,
      levelLoadingTimeOut: 20000,
      fragLoadingTimeOut: 25000,
      fragLoadingMaxRetry: 8
    });
    window.__hls = hls;
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      say('');
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
    });
    // 分片到达就清提示
    hls.on(Hls.Events.FRAG_LOADED, function () { say(''); });
    hls.on(Hls.Events.FRAG_BUFFERED, function () { say(''); });
    video.addEventListener('playing', function () { say(''); });
    hls.on(Hls.Events.ERROR, function (e, d) {
      if (!d) return;
      if (d.fatal) {
        if (d.type === 'networkError') {
          say('网络中断，重试中…', 1500);
          setTimeout(function () {
            try { hls.startLoad(); } catch (_) {}
          }, 500);
        } else if (d.type === 'mediaError') {
          try { hls.recoverMediaError(); } catch (_) { say('播放出错', 0); }
        } else {
          say('播放出错', 2500);
        }
      }
    });
  }

  if (typeof Hls === 'undefined') {
    var s = document.createElement('script');
    s.src = '/static/hls.min.js';
    s.onload = function () { loadHlsJs(); };
    s.onerror = function () { say('播放组件未加载', 0); };
    document.head.appendChild(s);
  } else {
    loadHlsJs();
  }
}

window.__hlsBoot = boot;
if (document.readyState === 'complete') boot();
else window.addEventListener('load', boot);
</script>
</body>
</html>
