plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.szxf.video_live"
    compileSdk 34

    defaultConfig {
        applicationId "com.szxf.video_live"
        minSdk 21
        targetSdk 34
        // Keep in sync with pubspec.yaml version: 1.0.4+4
        versionCode 4
        versionName "1.0.4"
    }

    signingConfigs {
        // Stable signing key so OTA / overwrite installs always match.
        // Override via env KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD if needed.
        release {
            storeFile file("video-live.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "VideoLive2026"
            keyAlias System.getenv("KEY_ALIAS") ?: "video-live"
            keyPassword System.getenv("KEY_PASSWORD") ?: "VideoLive2026"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

flutter {
    source "../.."
}
