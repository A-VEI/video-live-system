<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频直播</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a0a;color:#e8e8e8;height:100vh;display:flex;flex-direction:column}
.topbar{height:48px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 16px;font-size:15px;font-weight:600}
.layout{flex:1;display:flex;min-height:0}
.sidebar{width:240px;background:#111;border-right:1px solid #222;overflow-y:auto}
.chan{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;border-left:3px solid transparent}
.chan:hover{background:#1a1a1a}
.chan.active{background:#1a1a1a;border-left-color:#00d4aa}
.chan-num{width:28px;height:28px;background:#222;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#888}
.chan.active .chan-num{background:#00d4aa;color:#000}
.chan-name{font-size:13px;font-weight:500}
.main{flex:1;display:flex;flex-direction:column}
.player-wrap{flex:1;background:#000;position:relative;min-height:0}
.player-wrap video{width:100%;height:100%;object-fit:contain;display:none}
.player-wrap video.show{display:block}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#555;font-size:15px}
.loading{position:absolute;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
.loading.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid #333;border-top-color:#00d4aa;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.controls{height:40px;background:#111;border-top:1px solid #222;display:flex;align-items:center;padding:0 12px;gap:12px;font-size:12px;color:#888}
.controls button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px}
.info-bar{height:32px;background:#111;border-top:1px solid #222;display:flex;align-items:center;padding:0 16px;font-size:11px;color:#555;justify-content:space-between}
</style>
</head>
<body>
<div class="topbar">视频直播系统</div>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="player-wrap">
      <div class="placeholder" id="placeholder">选择左侧频道开始观看</div>
      <video id="player" muted autoplay playsinline></video>
      <div class="loading" id="loading"><div class="spinner"></div></div>
    </div>
    <div class="controls">
      <button onclick="togglePlay()" id="playBtn">&#9654;</button>
      <span id="time">00:00 / 00:00</span>
      <button onclick="toggleFull()" id="fsBtn" style="margin-left:auto">&#x26F6;</button>
    </div>
    <div class="info-bar">
      <span id="streamName"></span>
      <span id="streamUrl"></span>
    </div>
  </div>
</div>

<script src="/static/hls.min.js"></script>
<script>
var streams = [
  {id:1,name:'警情信息',url:'/proxy/192.168.181.106/live/0/hls.m3u8'},
  {id:2,name:'一体化指挥平台',url:'/proxy/192.168.181.103/live/0/hls.m3u8'},
  {id:3,name:'现场图传',url:'/proxy/192.168.181.105/live/0/hls.m3u8'},
  {id:4,name:'无人机画面',url:'/proxy/192.168.181.104/live/0/hls.m3u8'},
  {id:5,name:'社会面监控',url:'/proxy/192.168.181.101/live/0/hls.m3u8'},
  {id:6,name:'全国应急指挥系统',url:'/proxy/192.168.181.102/live/0/hls.m3u8'}
];
var hls=null, curIdx=-1;

// 渲染频道列表
var sb=document.getElementById('sidebar');
streams.forEach(function(s,i){
  var d=document.createElement('div');
  d.className='chan';
  d.innerHTML='<div class="chan-num">'+String(i+1).padStart(2,'0')+'</div><div class="chan-name">'+s.name+'</div>';
  d.onclick=function(){play(i)};
  sb.appendChild(d);
});

function play(idx){
  if(curIdx===idx) return;
  document.querySelectorAll('.chan').forEach(function(c){c.classList.remove('active')});
  sb.children[idx].classList.add('active');
  curIdx=idx;
  var s=streams[idx];
  document.getElementById('streamName').textContent=s.name;
  document.getElementById('streamUrl').textContent=s.url;
  document.getElementById('placeholder').style.display='none';
  document.getElementById('loading').classList.add('show');
  
  var video=document.getElementById('player');
  video.classList.remove('show');
  if(hls){hls.destroy();hls=null}
  
  if(Hls.isSupported()){
    hls=new Hls({maxBufferLength:10,maxMaxBufferLength:30});
    hls.loadSource(s.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){
      video.classList.add('show');
      document.getElementById('loading').classList.remove('show');
      video.play();
    });
    hls.on(Hls.Events.ERROR,function(e,d){
      if(d.fatal){
        document.getElementById('loading').classList.remove('show');
        document.getElementById('placeholder').style.display='';
        document.getElementById('placeholder').textContent='加载失败';
      }
    });
  } else {
    video.src=s.url;
    video.classList.add('show');
  }
}

function togglePlay(){
  var v=document.getElementById('player');
  if(v.paused){v.play();document.getElementById('playBtn').innerHTML='&#10074;&#10074;'}
  else{v.pause();document.getElementById('playBtn').innerHTML='&#9654;'}
}

function toggleFull(){
  var el=document.querySelector('.player-wrap');
  if(document.fullscreenElement){document.exitFullscreen()}
  else{el.requestFullscreen()}
}

// 更新时间
setInterval(function(){
  var v=document.getElementById('player');
  if(v.duration){
    document.getElementById('time').textContent=
      fmt(v.currentTime)+' / '+fmt(v.duration);
  }
},1000);

function fmt(d){
  var m=Math.floor(d/60).toString().padStart(2,'0');
  var s=Math.floor(d%60).toString().padStart(2,'0');
  return m+':'+s;
}
</script>
</body>
</html>
