name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android scaffolding
        run: |
          # Backup our lib/ code
          cp -r mobile-app/lib /tmp/lib_backup
          cp mobile-app/pubspec.yaml /tmp/pubspec_backup.yaml
          # Generate proper Android scaffolding
          cd mobile-app
          flutter create --org com.szxf --project-name video_live --platforms android .
          # Restore our code
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          flutter pub get

      - name: Build APK
        run: |
          cd mobile-app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-live-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
