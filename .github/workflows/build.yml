name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Verify Android project
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/szxf/video_live/MainActivity.kt
          test -f android/app/src/main/res/xml/file_paths.xml
          grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml

      - name: Install deps
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK
        run: |
          BUILD_TIME=$(date +%s)
          STAMP=$(date -u +%Y%m%d%H%M%S)
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          flutter build apk --release \
            --dart-define=BUILD_ID=${{ github.run_number }} \
            --dart-define=BUILD_TIME=$BUILD_TIME
        env:
          BASE_URL: ${{ vars.BASE_URL || 'http://112.25.181.94:8119' }}

      - name: Package artifact (name = build id + timestamp)
        run: |
          APK_SRC=build/app/outputs/flutter-apk/app-release.apk
          OUT="video-live_build${{ github.run_number }}_${STAMP}.apk"
          cp "$APK_SRC" "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          SIZE=$(stat -c%s "$OUT")
          cat > build-meta.json <<EOF
          {"build_id": ${{ github.run_number }}, "build_time": $BUILD_TIME, "stamp": "$STAMP", "sha256": "$SHA", "size": $SIZE, "apk": "$OUT"}
          EOF
          echo "built $OUT"
          cat build-meta.json
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-live-apk
          path: mobile-app/${{ env.APK_NAME }}

      - name: Upload build-meta
        uses: actions/upload-artifact@v4
        with:
          name: build-meta
          path: mobile-app/build-meta.json
