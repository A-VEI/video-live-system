<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改口令</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:32px;width:100%;max-width:400px}
h1{font-size:20px;margin-bottom:8px}
.hint{color:#94a3b8;font-size:13px;margin-bottom:24px;line-height:1.5}
label{display:block;font-size:13px;color:#94a3b8;margin:16px 0 6px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#f1f5f9;font-size:15px}
input:focus{outline:none;border-color:#2563eb}
button{width:100%;margin-top:24px;padding:12px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#1d4ed8}
.error{margin-top:16px;padding:12px;background:#7f1d1d;border-radius:8px;color:#fecaca;font-size:13px}
.rules{margin-top:12px;font-size:12px;color:#64748b;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <h1>修改登录口令</h1>
  <p class="hint">
    {% if must %}
      首次登录或口令已重置，必须修改口令后才能继续使用。
    {% else %}
      建议定期更换口令，不要使用手机号作为口令。
    {% endif %}
  </p>
  <form method="post" action="/change-password">
    <label>原口令</label>
    <input type="password" name="old_password" required autocomplete="current-password">
    <label>新口令</label>
    <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
    <label>确认新口令</label>
    <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
    <button type="submit">保存新口令</button>
  </form>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <div class="rules">
    口令规则：至少 8 位；不能与手机号相同；需包含字母/数字/符号中的两类；禁止过于简单的口令。
  </div>
</div>
</body>
</html>
